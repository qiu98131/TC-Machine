name: Ubuntu Cloud Desktop RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp
          echo "xfce4-session" > ~/.xsession
          sudo adduser xrdp ssl-cert
          sudo systemctl restart xrdp
          # 设置 runner 用户密码
          echo "runner:P@ssw0rd1qazXSW@#" | sudo chpasswd

      - name: 2. Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname="github-ubuntu-desktop"
          
          TS_IP=$(tailscale ip -4)
          echo "=========================================="
          echo "  >>> UBUNTU RDP DESKTOP IS READY! <<<"
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : runner"
          echo "  Password     : P@ssw0rd1qazXSW@#"
          echo "  Connect via mstsc to: $TS_IP:3389"
          echo "=========================================="

      - name: 3. Keep Server Alive (6 Hours Max)
        run: |
          for i in {1..360}; do
            sleep 60
            echo "[$i/360] Server running..."
          done
